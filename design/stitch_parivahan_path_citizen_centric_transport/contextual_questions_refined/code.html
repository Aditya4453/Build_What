<div class="flex-1 w-full max-w-container-max mx-auto px-margin-mobile lg:px-margin-desktop py-8 relative z-10 flex flex-col justify-center min-h-[calc(100vh-140px)]">
<div class="mb-8 max-w-3xl">
<p class="font-caption text-caption text-primary uppercase tracking-[0.1em] mb-2">Step 2 of 4</p>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-0">Is there an active loan on the vehicle?</h1>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-4xl mb-6" id="loan-options">
<button class="group relative flex flex-col h-full bg-surface-container rounded-xl p-6 text-center items-center justify-center min-h-[160px] transition-all duration-300 hover:shadow-md hover:-translate-y-1 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 ring-offset-surface select-card border-2 border-transparent" data-value="yes">
<div class="absolute inset-0 bg-primary opacity-0 group-[.selected]:opacity-5 transition-opacity duration-300 rounded-xl pointer-events-none"></div>
<div class="w-12 h-12 rounded-full bg-surface-container-high text-primary flex items-center justify-center mb-4 group-[.selected]:bg-primary group-[.selected]:text-on-primary transition-colors duration-300 shadow-sm">
<span class="material-symbols-outlined text-[24px]">account_balance</span>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-0 uppercase tracking-wide">YES, THE VEHICLE IS FINANCED</h3>
<div class="absolute top-4 right-4 opacity-0 group-[.selected]:opacity-100 transition-opacity duration-300">
<span class="material-symbols-outlined text-primary text-[28px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
<button class="group relative flex flex-col h-full bg-surface-container rounded-xl p-6 text-center items-center justify-center min-h-[160px] transition-all duration-300 hover:shadow-md hover:-translate-y-1 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 ring-offset-surface select-card border-2 border-transparent" data-value="no">
<div class="absolute inset-0 bg-primary opacity-0 group-[.selected]:opacity-5 transition-opacity duration-300 rounded-xl pointer-events-none"></div>
<div class="w-12 h-12 rounded-full bg-surface-container-high text-primary flex items-center justify-center mb-4 group-[.selected]:bg-primary group-[.selected]:text-on-primary transition-colors duration-300 shadow-sm">
<span class="material-symbols-outlined text-[24px]">task_alt</span>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-0 uppercase tracking-wide">NO, THE LOAN IS CLEARED</h3>
<div class="absolute top-4 right-4 opacity-0 group-[.selected]:opacity-100 transition-opacity duration-300">
<span class="material-symbols-outlined text-primary text-[28px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
</div>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl mb-8">If the vehicle is financed, we’ll include the financier’s No Objection Certificate (NOC) in your checklist.</p>
<div class="mt-auto pt-4 flex justify-between items-center w-full sticky bottom-0 bg-surface/95 backdrop-blur-sm py-4 z-20">
<button class="font-label-md text-label-md text-primary hover:text-primary-container px-6 py-3 flex items-center gap-2 transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
        Back
      </button>
<button class="bg-surface-variant text-on-surface-variant opacity-50 cursor-not-allowed font-label-md text-label-md px-8 py-3 rounded-full flex items-center gap-2 transition-all duration-300 shadow-sm hover:shadow-md" id="btn-continue">
        Continue
        <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const cards = document.querySelectorAll('.select-card');
      const progressiveSection = document.getElementById('progressive-disclosure');
      const continueBtn = document.getElementById('btn-continue');
      
      cards.forEach(card => {
        card.addEventListener('click', () => {
          
          cards.forEach(c => {
              c.classList.remove('selected', 'ring-2', 'ring-primary', 'shadow-md', 'border-primary');
              c.classList.add('bg-surface-container', 'border-transparent');
          });
          
          
          card.classList.add('selected', 'ring-2', 'ring-primary', 'shadow-md', 'border-primary');
          card.classList.remove('border-transparent');
          
          
          if (progressiveSection) {
            progressiveSection.classList.remove('hidden');
            setTimeout(() => {
              progressiveSection.classList.remove('opacity-0', 'translate-y-4');
              progressiveSection.classList.add('opacity-100', 'translate-y-0');
            }, 50);
          }

          
          continueBtn.classList.remove('bg-surface-variant', 'text-on-surface-variant', 'opacity-50', 'cursor-not-allowed');
          continueBtn.classList.add('bg-primary', 'text-on-primary');
        });
      });
    });
  </script>
